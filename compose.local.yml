name: nanocore

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --config /home/nonroot/.cloudflared/config.yml run nanoclaw
    volumes:
      - ${HOME}/.cloudflared:/home/nonroot/.cloudflared:ro
    networks:
      - nanoclaw

networks:
  nanoclaw:
    driver: bridge
